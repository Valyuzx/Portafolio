<section class="auth-wrapper">
  <div class="theme-toggle-container">
    <button matIconButton (click)="themeService.toggleTheme()"
      [attr.aria-label]="'Cambiar a modo ' + (themeService.theme() === 'dark' ? 'claro' : 'oscuro')">
      <mat-icon>{{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </div>

  <div class="auth-card">
    <p class="auth-headline">{{ title() }}</p>
    @if (showTabs()) {
    <div class="auth-tabs">
      <a class="auth-tab" routerLink="/login" routerLinkActive="auth-tab--active"
        [routerLinkActiveOptions]="{ exact: true }">
        Iniciar sesión
      </a>
      <a class="auth-tab" routerLink="/register" routerLinkActive="auth-tab--active"
        [routerLinkActiveOptions]="{ exact: true }">
        Registrarse
      </a>
    </div>
    }
    <ng-content />
    <ng-content select="[authFooter]" />
  </div>
</section>
